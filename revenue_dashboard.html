body{background:#0d1117;color:#e6edf3;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh}
.header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}

.header .meta{font-size:12px;color:#8b949e}
.kpi-bar{display:flex;gap:16px;padding:16px 24px;background:#0d1117;flex-wrap:wrap}
.kpi{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px 20px;flex:1;min-width:160px}
.kpi .label{font-size:11px;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
.kpi .value{font-size:22px;font-weight:700;color:#e6edf3}
.kpi .sub{font-size:11px;color:#8b949e;margin-top:4px}
.up{color:#22c55e}.down{color:#ef4444}.flat{color:#eab308}
.tabs{display:flex;gap:0;padding:0 24px;background:#161b22;border-bottom:1px solid #30363d;overflow-x:auto}
.tab{padding:12px 20px;font-size:13px;cursor:pointer;border-bottom:2px solid transparent;color:#8b949e;transition:.2s;white-space:nowrap}
.tab.active{color:#58a6ff;border-bottom-color:#58a6ff}
.tab:hover{color:#e6edf3}
.tab-content{display:none;padding:24px}
.tab-content.active{display:block}
.section-title{font-size:13px;font-weight:600;color:#8b949e;text-transform:uppercase;letter-spacing:.5px;margin-bottom:14px}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px}
.card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px}
.card-title{font-size:12px;color:#8b949e;margin-bottom:12px;font-weight:500}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:8px 12px;text-align:left;color:#8b949e;font-weight:500;border-bottom:1px solid #30363d;font-size:11px;text-transform:uppercase;letter-spacing:.4px}
td{padding:8px 12px;border-bottom:1px solid #21262d;color:#e6edf3}
tr:last-child td{border-bottom:none}
tr:hover td{background:#1c2129}
.badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:10px;font-weight:600}
.gm-green{color:#22c55e}.gm-yellow{color:#eab308}.gm-red{color:#ef4444}
.bg-green{background:#22c55e22;color:#22c55e}
.bg-yellow{background:#eab30822;color:#eab308}
.bg-red{background:#ef444422;color:#ef4444}
.chart-wrap{position:relative;height:280px}
.chart-wrap-lg{position:relative;height:300px}
.month-switcher{display:flex;gap:8px;margin-bottom:14px}
.month-btn{padding:6px 14px;border-radius:6px;border:1px solid #30363d;background:#0d1117;color:#8b949e;font-size:12px;cursor:pointer;transition:.2s}
.month-btn.active{background:#58a6ff22;border-color:#58a6ff;color:#58a6ff}
.month-btn:hover{border-color:#8b949e;color:#e6edf3}
.alert-card{background:#161b22;border:1px solid #ef444440;border-radius:8px;padding:14px 18px;margin-bottom:10px}
.alert-card .aname{font-size:14px;font-weight:600;color:#ef4444;margin-bottom:6px}
.alert-card .arow{display:flex;flex-wrap:wrap;gap:16px;font-size:12px;color:#8b949e}
.alert-card .val{color:#e6edf3;font-weight:500}
.scrollable{max-height:440px;overflow-y:auto}
.scrollable::-webkit-scrollbar{width:6px}
.scrollable::-webkit-scrollbar-track{background:#0d1117}
.scrollable::-webkit-scrollbar-thumb{background:#30363d;border-radius:3px}
.chip{display:inline-block;padding:2px 7px;border-radius:4px;font-size:10px;font-weight:600;background:#30363d;color:#8b949e}
.trend-up{color:#22c55e;font-size:12px}.trend-down{color:#ef4444;font-size:12px}
.footer{text-align:center;padding:16px;font-size:11px;color:#484f58;border-top:1px solid #21262d;margin-top:8px}
</style>

    <div class="kpi"><div class="label">Jun MTD Revenue (Proj.)</div><div class="value">${fM(junR)}</div>
      <div class="sub">16 of 22 BDs &middot; May actual: ${fM(mayR)}</div></div>
    <div class="kpi"><div class="label">Jun Blended GM%</div><div class="value"><span class="${gC(junGM)}">${fP(junGM)}</span></div>
      <div class="sub">May: ${fP(mayGM)} &middot; Apr: ${fP(aprGM)}</div></div>
    <div class="kpi"><div class="label">Revenue Alerts</div><div class="value" style="color:#ef4444">${ALERTS.length}</div>
      <div class="sub">Clients with &gt;50% MoM drop</div></div>
    <div class="kpi"><div class="label">Margin Watch</div><div class="value" style="color:#eab308">${MARGINS.length}</div>
      <div class="sub">Stable revenue, falling margins</div></div>`;
}
// ── TAB 1 OVERVIEW ──
function buildOverview(){
  const aprR=INDUSTRY_REV.filter(r=>r[0]==='Apr 26').reduce((s,r)=>s+r[4],0);
  const mayR=INDUSTRY_REV.filter(r=>r[0]==='May 26').reduce((s,r)=>s+r[4],0);
  const junR=INDUSTRY_REV.filter(r=>r[0]==='Jun 26').reduce((s,r)=>s+r[4],0);
  const aprGM=blendedGM('Apr 26'),mayGM=blendedGM('May 26'),junGM=blendedGM('Jun 26');
  const junInds=INDUSTRY_REV.filter(r=>r[0]==='Jun 26').sort((a,b)=>b[4]-a[4]);
  const indRows=junInds.map(r=>`<tr><td><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${IC[r[1]]||'#6b7280'};margin-right:6px;vertical-align:middle"></span>${r[1]}</td><td>${r[3]}</td><td>${f$(r[4])}</td><td>${gB(r[5])}</td></tr>`).join('');
  document.getElementById('tab-overview').innerHTML=`
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Revenue &amp; Gross Margin — Month over Month</div>
      <table><thead><tr><th>Month</th><th>Type</th><th>Total Revenue</th><th>MoM &Delta;</th><th>Blended GM%</th><th>GM &Delta;</th></tr></thead>
      <tbody>
        <tr><td>Apr 2026</td><td><span class="chip">ACTUAL</span></td><td>${f$(aprR)}</td><td>—</td><td class="${gC(aprGM)}">${fP(aprGM)}</td><td>—</td></tr>
        <tr><td>May 2026</td><td><span class="chip" style="background:#22c55e22;color:#22c55e">ACTUAL</span></td><td>${f$(mayR)}</td><td>${dB(mayR,aprR)}</td><td class="${gC(mayGM)}">${fP(mayGM)}</td><td>${dB(mayGM,aprGM)}</td></tr>
        <tr><td>Jun 2026 <small style="color:#8b949e">(MTD Proj.)</small></td><td><span class="chip" style="background:#f59e0b22;color:#f59e0b">FORECAST</span></td><td>${f$(junR)}</td><td>${dB(junR,mayR)}</td><td class="${gC(junGM)}">${fP(junGM)}</td><td>${dB(junGM,mayGM)}</td></tr>
      </tbody></table>
    </div>
    <div class="grid-2" style="margin-bottom:16px">
      <div class="card"><div class="card-title">12-Month ARR Trend</div><div class="chart-wrap"><canvas id="arrChart"></canvas></div></div>
      <div class="card"><div class="card-title">Revenue by Vertical — 3-Month Stacked</div><div class="chart-wrap"><canvas id="indChart"></canvas></div></div>
    </div>
    <div class="card" style="margin-bottom:16px">
      <div class="card-title">Jun 2026 Revenue by Vertical (MTD Projected, 16/22 BDs)</div>
      <table><thead><tr><th>Vertical</th><th>Clients</th><th>Revenue</th><th>GM%</th></tr></thead><tbody>${indRows}</tbody></table>
    </div>
    <div class="card" style="max-width:380px">
      <div class="card-title">Top Clients by ARR (Latest Snapshot)</div>
      <div class="chart-wrap" style="height:200px"><canvas id="arrDonut"></canvas></div>
    </div>`;
  // Charts
  new Chart(document.getElementById('arrChart'),{type:'line',data:{labels:ARR_TREND.map(r=>r.m),datasets:[{label:'ARR',data:ARR_TREND.map(r=>r.arr/1e6),borderColor:'#58a6ff',backgroundColor:'#58a6ff15',fill:true,tension:.35,pointRadius:3}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>'$'+c.parsed.y.toFixed(2)+'M'}}},scales:{x:{grid:{color:'#21262d'},ticks:{color:'#8b949e',font:{size:10}}},y:{grid:{color:'#21262d'},ticks:{color:'#8b949e',callback:v=>'$'+v.toFixed(0)+'M'}}}}});
  const allInds=[...new Set(INDUSTRY_REV.map(r=>r[1]).filter(i=>i!=='Platform'&&i!=='SMB'))];
  new Chart(document.getElementById('indChart'),{type:'bar',data:{labels:['Apr 26','May 26','Jun 26'],datasets:allInds.map(ind=>({label:ind,data:['Apr 26','May 26','Jun 26'].map(m=>{const r=INDUSTRY_REV.find(x=>x[0]===m&&x[1]===ind);return r?r[4]/1e6:0}),backgroundColor:IC[ind]||'#6b7280',borderWidth:0}))},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8b949e',font:{size:10},boxWidth:10}}},scales:{x:{stacked:true,grid:{color:'#21262d'},ticks:{color:'#8b949e'}},y:{stacked:true,grid:{color:'#21262d'},ticks:{color:'#8b949e',callback:v=>'$'+v.toFixed(1)+'M'}}}}});
  new Chart(document.getElementById('arrDonut'),{type:'doughnut',data:{labels:TOP_ARR.map(r=>r.name),datasets:[{data:TOP_ARR.map(r=>r.arr),backgroundColor:['#3b82f6','#a855f7','#10b981'],borderWidth:0}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8b949e',font:{size:11},boxWidth:10}},tooltip:{callbacks:{label:c=>`${c.label}: ${f$(c.parsed)}`}}}}});
}
// ── TAB 2 CLIENTS ──
function buildClients(){
  const arrRows=TOP_ARR.map((r,i)=>`<tr><td>${i+1}</td><td>${r.name}</td><td style="color:${IC[r.ind]||'#6b7280'}">${r.ind}</td><td>${f$(r.arr)}</td></tr>`).join('');
  document.getElementById('tab-clients').innerHTML=`
    <div class="grid-2">
      <div class="card">
        <div class="card-title">Top Clients by ARR (Latest Snapshot)</div>
        <p style="font-size:11px;color:#8b949e;margin-bottom:10px">ARR data reflects latest available reporting period</p>
        <table><thead><tr><th>#</th><th>Client</th><th>Vertical</th><th>ARR</th></tr></thead><tbody>${arrRows}</tbody></table>
      </div>
      <div class="card">
        <div class="card-title">Top 10 by Revenue</div>
        <div class="month-switcher">
          <button class="month-btn" id="mbApr" onclick="switchM('Apr 26')">Apr 26</button>
          <button class="month-btn" id="mbMay" onclick="switchM('May 26')">May 26</button>
          <button class="month-btn active" id="mbJun" onclick="switchM('Jun 26')">Jun 26 ★</button>
        </div>
        <div id="revTbl"></div>
      </div>
    </div>`;
  renderRevTbl('Jun 26');
}
function switchM(m){
  document.querySelectorAll('.month-btn').forEach(b=>b.classList.remove('active'));
  const ids={'Apr 26':'mbApr','May 26':'mbMay','Jun 26':'mbJun'};
  if(ids[m]) document.getElementById(ids[m]).classList.add('active');
  renderRevTbl(m);
}
function renderRevTbl(m){
  const isProj=m==='Jun 26';
  const rows=TOP_CLIENTS_REV.filter(r=>r[0]===m);
  document.getElementById('revTbl').innerHTML=`<table><thead><tr><th>#</th><th>Client</th><th>Vertical</th><th>Revenue${isProj?' (Proj.)':''}</th><th>GM%</th></tr></thead><tbody>
    ${rows.map(r=>`<tr><td>${r[5]}</td><td>${r[1]}</td><td style="font-size:11px;color:${IC[r[2]]||'#6b7280'}">${r[2]}</td><td>${f$(r[3])}</td><td>${gB(r[4])}</td></tr>`).join('')}
  </tbody></table>`;
}
// ── TAB 3 ALERTS ──
function buildAlerts(){
  const totalM2=ALERTS.reduce((s,r)=>s+(r.m2||0),0);
  const cards=ALERTS.map(r=>{
    const drop=r.m2>0?((r.m1-r.m2)/r.m2*100).toFixed(1):null;
    return`<div class="alert-card">
      <div class="aname">${r.name}</div>
      <div class="arow">
        <div>Vertical: <span class="val">${r.ind}</span></div>
        <div>M-2 Rev: <span class="val">${f$(r.m2)}</span></div>
        <div>M-1 Rev: <span class="val">${f$(r.m1)}</span></div>
        ${r.cur!=null?`<div>Jun MTD: <span class="val">${f$(r.cur)}</span></div>`:''}
        ${drop?`<div>MoM Drop: <span class="val" style="color:#ef4444">${drop}%</span></div>`:''}
      </div></div>`;
  }).join('');
  document.getElementById('tab-alerts').innerHTML=`
    <div class="grid-2" style="margin-bottom:16px">
      <div class="kpi" style="border-color:#ef444450"><div class="label">Clients at Risk</div><div class="value" style="color:#ef4444">${ALERTS.length}</div><div class="sub">&gt;50% MoM revenue decline (M-2 to M-1)</div></div>
      <div class="kpi" style="border-color:#ef444450"><div class="label">M-2 Revenue at Risk</div><div class="value" style="color:#ef4444">${f$(totalM2)}</div><div class="sub">Combined Apr revenue from affected accounts</div></div>
    </div>
    <div class="section-title">Affected Accounts — Sorted by Severity</div>
    <div class="scrollable">${cards}</div>`;
}
// ── TAB 4 MARGINS ──
function buildMargins(){
  const rows=MARGINS.map(r=>`<tr>
    <td>${r.name}</td>
    <td style="font-size:11px;color:${IC[r.ind]||'#6b7280'}">${r.ind}</td>
    <td>${fK(r.rm2)}</td><td>${fK(r.rm1)}</td><td>${r.rcur!=null?fK(r.rcur):'—'}</td>
    <td class="${gC(r.gm2)}">${fP(r.gm2)}</td>
    <td class="${gC(r.gm1)}">${fP(r.gm1)}</td>
    <td class="${gC(r.gcur)}">${r.gcur!=null?fP(r.gcur):'—'}</td>
    <td><span class="trend-down">${r.d.toFixed(1)} pp</span></td>
  </tr>`).join('');
  document.getElementById('tab-margins').innerHTML=`
    <div class="card" style="margin-bottom:12px;padding:10px 16px;font-size:12px;color:#8b949e">
      Clients where revenue is stable (&le;30% MoM change, min $10K/mo) but gross margin fell &gt;0.4 pp from Apr to May. Sorted by worst margin decline.
    </div>
    <div class="card" style="padding:0"><div class="scrollable">
      <table><thead><tr><th>Client</th><th>Vertical</th><th>Rev Apr</th><th>Rev May</th><th>Rev Jun</th><th>GM Apr</th><th>GM May</th><th>GM Jun</th><th>Margin &Delta;</th></tr></thead>
      <tbody>${rows}</tbody></table>
    </div></div>`;
}
// ── TAB 5 DAILY ──
function buildDaily(){
  const mayRows=DAILY.filter(r=>r[0]==='May');
  const junRows=DAILY.filter(r=>r[0]==='Jun');
  // Compute May cumulative by BD (max BD = 20)
  let bd=0,cum=0;
  const mayCum={};
  for(const r of mayRows){if(r[2]===1)bd++;cum+=r[5];if(bd>0)mayCum[bd]=cum;}
  // Jun cumulative by BD
  let cumJ=0;
  const junCum={};
  for(const r of junRows){cumJ+=r[5];if(r[3]!=null)junCum[r[3]]=cumJ;}
  const N=22;
  const labels=Array.from({length:N},(_,i)=>'BD '+(i+1));
  const mayCumArr=labels.map((_,i)=>mayCum[i+1]!=null?mayCum[i+1]/1e6:null);
  const junCumArr=labels.map((_,i)=>junCum[i+1]!=null?junCum[i+1]/1e6:null);
  // GM by business day
  const mayBDGM=[],junBDGM=[];
  bd=0;
  for(const r of mayRows)if(r[2]===1){bd++;mayBDGM.push({bd,gm:r[6]});}
  for(const r of junRows)if(r[2]===1&&r[3]!=null)junBDGM.push({bd:r[3],gm:r[6]});
  const bdL=Array.from({length:20},(_,i)=>'BD '+(i+1));
  const mGM=bdL.map((_,i)=>{const f=mayBDGM.find(x=>x.bd===i+1);return f?f.gm:null;});
  const jGM=bdL.map((_,i)=>{const f=junBDGM.find(x=>x.bd===i+1);return f?f.gm:null;});
  // Jun detail table
  let cumD=0;
  const junDetail=junRows.map(r=>{cumD+=r[5];return`<tr>
    <td>${r[1]}</td>
    <td>${r[2]===1?'<span class="badge bg-green">Business Day</span>':'<span class="badge" style="background:#21262d;color:#8b949e">Weekend/Holiday</span>'}</td>
    <td>${r[3]!=null?'BD '+r[3]:'—'}</td>
    <td>${f$(r[5])}</td>
    <td class="${gC(r[6])}">${fP(r[6])}</td>
    <td>${fM(cumD)}</td>
  </tr>`;}).join('');
  document.getElementById('tab-daily').innerHTML=`
    <div class="grid-2" style="margin-bottom:16px">
      <div class="card"><div class="card-title">Cumulative Revenue — Jun vs May (BD Aligned)</div><div class="chart-wrap-lg"><canvas id="cumChart"></canvas></div></div>
      <div class="card"><div class="card-title">Daily GM% by Business Day</div><div class="chart-wrap-lg"><canvas id="gmChart"></canvas></div></div>
    </div>
    <div class="card"><div class="card-title">Jun 2026 Daily Revenue Detail</div>
      <div class="scrollable"><table><thead><tr><th>Date</th><th>Day Type</th><th>BD #</th><th>Daily Revenue</th><th>GM%</th><th>Cumulative MTD</th></tr></thead><tbody>${junDetail}</tbody></table></div>
    </div>`;
  new Chart(document.getElementById('cumChart'),{type:'line',data:{labels,datasets:[
    {label:'Jun 26 (Actual+Proj.)',data:junCumArr,borderColor:'#58a6ff',backgroundColor:'#58a6ff18',fill:true,tension:.3,pointRadius:2,spanGaps:false},
    {label:'May 26 (Actual)',data:mayCumArr,borderColor:'#6b7280',borderDash:[5,4],borderWidth:2,tension:.3,pointRadius:2,fill:false,spanGaps:false}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8b949e',font:{size:11}}},tooltip:{callbacks:{label:c=>c.parsed.y!=null?`${c.dataset.label}: $${c.parsed.y.toFixed(2)}M`:null}}},scales:{x:{grid:{color:'#21262d'},ticks:{color:'#8b949e',font:{size:10},maxTicksLimit:11}},y:{grid:{color:'#21262d'},ticks:{color:'#8b949e',callback:v=>'$'+v.toFixed(1)+'M'}}}}});
  new Chart(document.getElementById('gmChart'),{type:'line',data:{labels:bdL,datasets:[
    {label:'Jun 26 GM%',data:jGM,borderColor:'#22c55e',backgroundColor:'#22c55e18',fill:true,tension:.3,pointRadius:3,spanGaps:false},
    {label:'May 26 GM%',data:mGM,borderColor:'#6b7280',borderDash:[5,4],borderWidth:2,tension:.3,pointRadius:2,fill:false,spanGaps:false}
  ]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{labels:{color:'#8b949e',font:{size:11}}},tooltip:{callbacks:{label:c=>c.parsed.y!=null?`${c.dataset.label}: ${c.parsed.y.toFixed(1)}%`:null}}},scales:{x:{grid:{color:'#21262d'},ticks:{color:'#8b949e',font:{size:10}}},y:{min:40,grid:{color:'#21262d'},ticks:{color:'#8b949e',callback:v=>v+'%'}}}}});
}
// ── TAB SWITCHER ──
const initialized=new Set();
function showTab(tab,el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.querySelectorAll('.tab-content').forEach(t=>t.classList.remove('active'));
  if(el)el.classList.add('active');
  document.getElementById('tab-'+tab).classList.add('active');
  if(!initialized.has(tab)){
    initialized.add(tab);
    if(tab==='clients')buildClients();
    else if(tab==='alerts')buildAlerts();
    else if(tab==='margins')buildMargins();
    else if(tab==='daily')buildDaily();
  }
}
// ── INIT ──
buildKPI();
buildOverview();
initialized.add('overview');
</script>
</body>
</html>
