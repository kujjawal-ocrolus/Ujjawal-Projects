<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d1117;color:#e6edf3;font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}
  .header{background:#161b22;border-bottom:1px solid #30363d;padding:16px 24px;display:flex;align-items:center;justify-content:space-between}
  .header h1{font-size:20px;font-weight:600;color:#f0f6fc}
  .header .meta{font-size:12px;color:#8b949e}
  .tabs{background:#161b22;border-bottom:1px solid #30363d;display:flex;padding:0 24px;gap:4px}
  .tab{padding:12px 16px;cursor:pointer;color:#8b949e;border-bottom:2px solid transparent;font-size:13px;font-weight:500;transition:color .15s}
  .tab:hover{color:#e6edf3}
  .tab.active{color:#58a6ff;border-bottom-color:#58a6ff}
  .panel{display:none;padding:24px;max-width:1400px;margin:0 auto}
  .panel.active{display:block}
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:24px}
  .kpi{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:16px}
  .kpi-label{font-size:12px;color:#8b949e;margin-bottom:6px;text-transform:uppercase;letter-spacing:.5px}
  .kpi-value{font-size:26px;font-weight:700;color:#f0f6fc}
  .kpi-sub{font-size:12px;color:#8b949e;margin-top:4px}
  .kpi-sub.up{color:#3fb950}
  .kpi-sub.down{color:#f85149}
  .grid-2{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:24px}
  @media(max-width:900px){.grid-2{grid-template-columns:1fr}}
  .card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:20px}
  .card-title{font-size:14px;font-weight:600;color:#f0f6fc;margin-bottom:16px}
  .card-subtitle{font-size:12px;color:#8b949e;margin-bottom:16px}
  .chart-wrap{position:relative;height:280px}
  .chart-wrap-sm{position:relative;height:220px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th{background:#0d1117;color:#8b949e;font-weight:500;text-align:left;padding:8px 10px;border-bottom:1px solid #30363d;font-size:12px;text-transform:uppercase;letter-spacing:.5px;white-space:nowrap}
  td{padding:8px 10px;border-bottom:1px solid #21262d;color:#e6edf3;vertical-align:middle}
  tr:hover td{background:#1c2128}
  tr:last-child td{border-bottom:none}
  .badge{display:inline-block;padding:2px 8px;border-radius:12px;font-size:11px;font-weight:600}
  .badge-green{background:#1a4a2e;color:#3fb950}
  .badge-yellow{background:#3d2c00;color:#e3b341}
  .badge-red{background:#3d0a0a;color:#f85149}
  .badge-gray{background:#21262d;color:#8b949e}
  .badge-blue{background:#0c2d4a;color:#58a6ff}
  .month-switcher{display:flex;gap:8px;margin-bottom:16px}
  .month-btn{padding:5px 14px;border:1px solid #30363d;border-radius:6px;background:transparent;color:#8b949e;cursor:pointer;font-size:12px;font-weight:500;transition:all .15s}
  .month-btn.active,.month-btn:hover{background:#21262d;color:#f0f6fc;border-color:#58a6ff}
  .summary-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:20px}
  .summary-card{background:#161b22;border:1px solid #30363d;border-radius:8px;padding:14px;text-align:center}
  .summary-card-value{font-size:28px;font-weight:700;color:#f0f6fc}
  .summary-card-label{font-size:12px;color:#8b949e;margin-top:4px}
  .delta-down{color:#f85149;font-weight:600}
  .delta-up{color:#3fb950;font-weight:600}
  .full-card{margin-bottom:24px}
  .table-scroll{overflow-x:auto}
  .tag{display:inline-block;padding:1px 6px;border-radius:4px;font-size:11px;background:#21262d;color:#8b949e}
  .forecast-tag{background:#0c2d4a;color:#58a6ff}
</style>
</head>

const fmt = v => v==null ? '&mdash;' : '$'+Math.round(v).toLocaleString();
const fmtM = v => v==null ? '&mdash;' : '$'+(v/1e6).toFixed(2)+'M';
const fmtPct = v => v==null ? '&mdash;' : v.toFixed(1)+'%';
const pct = (a,b) => b ? Math.round((a-b)/b*100) : null;

function gmBadge(gm){
  if(gm==null) return '<span class="badge badge-gray">&mdash;</span>';
  if(gm>=70) return '<span class="badge badge-green">'+gm.toFixed(1)+'%</span>';
  if(gm>=55) return '<span class="badge badge-yellow">'+gm.toFixed(1)+'%</span>';
  return '<span class="badge badge-red">'+gm.toFixed(1)+'%</span>';
}

function deltaHtml(v){
  if(v==null) return '&mdash;';
  const cl = v>=0 ? 'delta-up' : 'delta-down';
  return '<span class="'+cl+'">'+(v>=0?'+':'')+v+'%</span>';
}

const IND_COLORS = {
  "Small Business Lending":"#58a6ff",
  "Mortgage":"#a371f7",
  "Consumer":"#3fb950",
  "Professional Services":"#e3b341",
  "Banking/KYC":"#39d353",
  "Other Lending":"#f0883e",
  "Medicaid":"#ff7b72",
  "Property Management":"#79c0ff"
};

function monthlyAgg(){
  return ["Apr '26","May '26","Jun '26"].map(m=>{
    const rows = REV_INDUSTRY.filter(r=>r.month===m);
    const totalRev = rows.reduce((s,r)=>s+r.revenue,0);
    const gp = rows.reduce((s,r)=>s+(r.revenue*(r.gm||0)/100),0);
    const gm = totalRev>0 ? parseFloat((gp/totalRev*100).toFixed(1)) : null;
    return {month:m, revenue:totalRev, gm, type:rows[0]?.type||''};
  });
}

function buildDaily(){
  const el = document.getElementById('daily');
  el.innerHTML = `
  <div class="grid-2" style="margin-bottom:24px">
    <div class="card">
      <div class="card-title">Cumulative Revenue &mdash; Business Day Aligned</div>
      <div class="card-subtitle">May 2026 (final) vs Jun 2026 (MTD, through Jun 18)</div>
      <div class="chart-wrap"><canvas id="cumRevChart"></canvas></div>
    </div>
    <div class="card">
      <div class="card-title">Daily Gross Margin % &mdash; Business Days</div>
      <div class="card-subtitle">May 2026 vs Jun 2026 (business days only)</div>
      <div class="chart-wrap"><canvas id="gmPctChart"></canvas></div>
    </div>
  </div>
  <div class="card full-card">
    <div class="card-title">Daily Revenue Detail &mdash; June 2026</div>
    <div class="table-scroll">
    <table>
      <thead><tr><th>Date</th><th>Day Type</th><th>Daily Revenue</th><th>Daily GM%</th><th>Cumulative Revenue</th></tr></thead>
      <tbody id="dailyTable"></tbody>
    </table>
    </div>
  </div>
  `;

  const mayRows = DAILY_TREND.filter(r=>r.month==="May '26");
  const junRows = DAILY_TREND.filter(r=>r.month==="Jun '26");

  // May: compute cumulative BD from weight
  let mayCumBD=0, mayCumRev=0;
  const mayBDArr=[], mayCumRevArr=[], mayGmBDArr=[], mayGmArr=[];
  mayRows.forEach(r=>{
    mayCumRev += r.dailyRev;
    if(r.weight>0){
      mayCumBD++;
      mayBDArr.push(mayCumBD);
      mayCumRevArr.push(mayCumRev);
      mayGmBDArr.push(mayCumBD);
      mayGmArr.push(r.dailyGm);
    }
  });

  // June: use bdElapsed
  let junCumRev=0;
  const junBDArr=[], junCumRevArr=[], junGmBDArr=[], junGmArr=[];
  junRows.forEach(r=>{
    junCumRev += r.dailyRev;
    if(r.weight>0 && r.bdElapsed){
      junBDArr.push(r.bdElapsed);
      junCumRevArr.push(junCumRev);
      junGmBDArr.push(r.bdElapsed);
      junGmArr.push(r.dailyGm);
    }
  });

  const maxBD = Math.max(...mayBDArr,...junBDArr);

  new Chart(document.getElementById('cumRevChart'),{

    data:{
      labels:bdLabels,
      datasets:[

    options:{

      scales:{
        x:{grid:{color:'#21262d'},ticks:{color:'#8b949e'},title:{display:true,text:'Business Day',color:'#8b949e',font:{size:12}}},
        y:{grid:{color:'#21262d'},ticks:{color:'#8b949e',callback:v=>fmtM(v)}}
      }
    }
  });

  new Chart(document.getElementById('gmPctChart'),{
    type:'line',
    data:{
      labels:bdLabels,
      datasets:[
        {label:"May '26",data:align(mayGmBDArr,mayGmArr,bdLabels),borderColor:'#8b949e',fill:false,tension:0.3,pointRadius:3,borderDash:[4,4],spanGaps:false},
        {label:"Jun '26",data:align(junGmBDArr,junGmArr,bdLabels),borderColor:'#3fb950',fill:false,tension:0.3,pointRadius:4,spanGaps:false}
      ]
    },
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{labels:{color:'#8b949e',font:{size:12}}},tooltip:{callbacks:{label:c=>`${c.dataset.label}: ${c.raw?.toFixed(1)}%`}}},
      scales:{
        x:{grid:{color:'#21262d'},ticks:{color:'#8b949e'},title:{display:true,text:'Business Day',color:'#8b949e',font:{size:12}}},
        y:{grid:{color:'#21262d'},ticks:{color:'#8b949e',callback:v=>v.toFixed(0)+'%'},min:50,max:80}
      }
    }
  });

  // Daily table for June
  let cumRev=0;
  const tbody = document.getElementById('dailyTable');
  junRows.forEach(r=>{
    cumRev += r.dailyRev;
    const tr=document.createElement('tr');
    tr.innerHTML=`
      <td>${r.date}</td>
      <td>${r.weight>0?'<span class="badge badge-blue">Business Day</span>':'<span class="badge badge-gray">Weekend/Holiday</span>'}</td>
      <td>${fmt(r.dailyRev)}</td>
      <td>${gmBadge(r.dailyGm)}</td>
      <td>${fmtM(cumRev)}</td>
    `;
    tbody.appendChild(tr);
  });
}
